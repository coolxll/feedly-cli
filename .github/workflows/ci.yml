name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - name: Show version
        run: node --version && npm --version
      - name: Test
        run: npm test
      - name: Smoke test the binary
        run: node bin/feedly.js --version && node bin/feedly.js --help > /dev/null
